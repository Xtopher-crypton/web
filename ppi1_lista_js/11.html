<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorando Eventos em JavaScript</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; transition: background-color 0.3s ease; }
        div { margin-bottom: 10px; padding: 10px; border: 1px solid #ccc; }
        input { padding: 8px; }
        button { padding: 10px 15px; }
        select { padding: 8px; }
    </style>
</head>
<body>
  <button id="alertButton">Clique aqui</button>
  <input type="text" id="textInput" placeholder="Digite algo">
  <div id="hoverDiv">Passe o mouse aqui</div>
  <select id="colorSelect">
    <option value="">Escolha uma cor</option>
    <option value="blue">Azul</option>
    <option value="green">Verde</option>
    <option value="red">Vermelho</option>
  </select>

    <script>
        // a)
        document.getElementById("alertButton").addEventListener("click", function() {
            alert("Botão clicado!");
        });

        // b)
        document.getElementById("textInput").addEventListener("keydown", function(event) {
            console.log("Tecla pressionada: " + event.key);
        });

        // c)
        const textInput = document.getElementById("textInput");
        let originalInputBackgroundColor = textInput.style.backgroundColor;
        textInput.addEventListener("focus", function() {
            this.style.backgroundColor = "yellow";
        });

        // d)
        textInput.addEventListener("blur", function() {
            this.style.backgroundColor = originalInputBackgroundColor;
        });

        // e)
        const hoverDiv = document.getElementById("hoverDiv");
        let originalDivBackgroundColor = hoverDiv.style.backgroundColor;
        hoverDiv.addEventListener("mouseover", function() {
            this.style.backgroundColor = "lightgray";
        });

        // f)
        hoverDiv.addEventListener("mouseout", function() {
            this.style.backgroundColor = originalDivBackgroundColor;
        });

        // g)
        const colorSelect = document.getElementById("colorSelect");
        let originalBodyBackgroundColor = document.body.style.backgroundColor;
        colorSelect.addEventListener("change", function() {
            if (this.value) {
                document.body.style.backgroundColor = this.value;
            } else {
                document.body.style.backgroundColor = originalBodyBackgroundColor;
            }
        });
    </script>
</body>
</html>
