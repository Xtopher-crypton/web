<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Teclas do Teclado</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #saida { 
            border: 1px solid #ccc; 
            padding: 15px; 
            min-height: 100px; 
            margin-top: 20px; 
            font-size: 1.2em; 
            background-color: #f9f9f9;
            white-space: pre-wrap; /* Mantém espaços e quebras de linha */
            word-wrap: break-word;
        }
        .key-info {
            color: #666;
            font-size: 0.8em;
            margin-left: 5px;
            background: #eee;
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>Captura de Teclas do Teclado</h1>
    <p>Pressione qualquer tecla para ver o resultado abaixo (inclui o desafio extra):</p>
    <div id="saida"></div>

    <script>
        const saidaDiv = document.getElementById("saida");
        let teclasDigitadas = [];

        document.addEventListener("keydown", function(event) {
            console.log("Tecla pressionada:", event.key, "| Code:", event.code);

            // Desafio Extra: Tratar Backspace para apagar o último item
            if (event.key === "Backspace") {
                teclasDigitadas.pop();
            } 
            // Captura caracteres imprimíveis ou teclas de controle específicas
            else {
                let char = event.key;
                
                // Ajuste para exibição visual de teclas de controle
                if (event.key === " ") char = " "; // Espaço
                
                // Só adiciona se for uma tecla de caractere (length 1) ou Enter/Space
                if (event.key.length === 1 || event.key === "Enter") {
                    teclasDigitadas.push({
                        char: char,
                        code: event.code
                    });
                }
            }

            // Renderiza o conteúdo no div
            renderizarSaida();
        });

        function renderizarSaida() {
            saidaDiv.innerHTML = "";
            teclasDigitadas.forEach(item => {
                const spanChar = document.createElement("span");
                spanChar.textContent = item.char === "Enter" ? "\n" : item.char;
                
                const spanCode = document.createElement("span");
                spanCode.className = "key-info";
                spanCode.textContent = `[${item.code}]`;
                
                saidaDiv.appendChild(spanChar);
                saidaDiv.appendChild(spanCode);
            });
        }
    </script>
</body>
</html>
