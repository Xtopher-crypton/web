<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Teclas do Teclado</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #saida { border: 1px solid #ccc; padding: 10px; min-height: 100px; margin-top: 20px; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>Captura de Teclas do Teclado</h1>
    <p>Pressione qualquer tecla para ver o resultado abaixo:</p>
    <div id="saida"></div>

    <script>
        const saidaDiv = document.getElementById("saida");
        let textoExibido = "";

        document.addEventListener("keydown", function(event) {
            console.log("Tecla pressionada: ", event.key, "(Code: ", event.code, ")");

            if (event.key === "Backspace") {
                textoExibido = textoExibido.slice(0, -1);
            } else if (event.key.length === 1) { 
                textoExibido += event.key;
            } else if (event.key === "Space") {
                textoExibido += " ";
            } else if (event.key === "Enter") {
                textoExibido += "\n";

            saidaDiv.innerText = textoExibido;
        });
    </script>
</body>
</html>
