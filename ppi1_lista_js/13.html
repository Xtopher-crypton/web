<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desenhando com Canvas</title>
</head>
<body>
    <h1>Desenho com Canvas</h1>
    <canvas id="meuCanvas" width="400" height="300" style="border:1px solid #000;"></canvas>

    <script>
        // a)
        const canvas = document.getElementById("meuCanvas");
        const ctx = canvas.getContext("2d");

        

        // b)
        ctx.fillStyle = "blue";
        ctx.fillRect(50, 50, 100, 50);

        // c)
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(200, 150, 30, 0, Math.PI * 2);
        ctx.fill();

        // d)
        ctx.fillStyle = "black";
        ctx.font = "30px Arial";
        ctx.fillText("Canvas!", 120, 250);
    </script>
</body>
</html>
