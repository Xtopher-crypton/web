<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alteração de Cores com Tecla de Espaço</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.5s ease;
        }
        .box {
            width: 100px;
            height: 100px;
            margin: 10px;
            border: 1px solid black;
            transition: background-color 0.5s ease;
        }
    </style>
</head>
<body>
    <h1>Pressione a barra de espaço para mudar as cores</h1>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>

    <script>
        function gerarCorAleatoria() {
            const letras = "0123456789ABCDEF";
            let cor = "#";
            for (let i = 0; i < 6; i++) {
                cor += letras[Math.floor(Math.random() * 16)];
            }
            return cor;
        }

        document.body.addEventListener("keydown", function(event) {
            if (event.code === "Space") {
                document.body.style.backgroundColor = gerarCorAleatoria();
                document.getElementById("box1").style.backgroundColor = gerarCorAleatoria();
                document.getElementById("box2").style.backgroundColor = gerarCorAleatoria();
                document.getElementById("box3").style.backgroundColor = gerarCorAleatoria();
            }
        });
    </script>
</body>
</html>
